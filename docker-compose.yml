services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techmoveglms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - techmoveglms-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    container_name: techmoveglms-api
    build:
      context: .
      dockerfile: TechMoveGLMS.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TechMoveGLMSDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${JWT_KEY}"
    ports:
      - "5039:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  web:
    container_name: techmoveglms-web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ApiSettings__BaseUrl: "http://api:8080/"
    ports:
      - "5133:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  techmoveglms-sql-data: